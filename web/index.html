<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <title>S-ChatGPT SLOT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="machine">
    <header class="topbar">
      <div>
        <div class="eyebrow">SETTING 6 PROTOTYPE</div>
        <h1>S-ChatGPT SLOT</h1>
      </div>
      <div class="status-lamp" id="statusLamp"><span></span><b id="statusText">BOOT</b></div>
    </header>

    <section class="lcd">
      <div class="headline">
        <div>
          <span class="label">MODE</span>
          <strong id="mode">---</strong>
        </div>
        <div>
          <span class="label">AT</span>
          <strong id="tier">---</strong>
        </div>
        <div>
          <span class="label">TABLE</span>
          <strong id="table">---</strong>
        </div>
      </div>

      <div class="main-counter">
        <div class="counter-block">
          <span>GAME</span>
          <b id="gameCount">0</b>
        </div>
        <div class="counter-block hot">
          <span>AT LEFT</span>
          <b id="atLeft">0G</b>
        </div>
        <div class="counter-block">
          <span>STOCK</span>
          <b id="stocks">0</b>
        </div>
      </div>

      <div class="event-banner" id="eventBanner">
        <span class="event-kicker">LAST EVENT</span>
        <strong id="eventTitle">READY</strong>
        <small id="eventNote">レバーを叩け</small>
      </div>
    </section>

    <section class="reel-window" aria-label="slot reels">
      <div class="reel" id="reel1"><span data-kind="seven">7</span><span data-kind="bell">🔔<small>BELL</small></span><span data-kind="bar">BAR</span></div>
      <div class="reel" id="reel2"><span data-kind="cherry">🍒<small>CHERRY</small></span><span data-kind="seven">7</span><span data-kind="replay">↻<small>REPLAY</small></span></div>
      <div class="reel" id="reel3"><span data-kind="bar">BAR</span><span data-kind="bell">🔔<small>BELL</small></span><span data-kind="seven">7</span></div>
      <div class="payline"></div>
    </section>

    <section class="controls">
      <button id="lever" class="lever">LEVER<br><small>1 GAME</small></button>
      <div class="stops">
        <button class="stop" data-stop="0">STOP 1</button>
        <button class="stop" data-stop="1">STOP 2</button>
        <button class="stop" data-stop="2">STOP 3</button>
      </div>
      <div class="utility">
        <button id="autoToggle" aria-pressed="false">AUTO OFF</button>
        <button id="reset">RESET</button>
      </div>
    </section>

    <section class="dashboard">
      <div class="card">
        <span class="label">NORMAL PATTERN</span>
        <b id="normalPattern">-</b>
        <small id="ceiling">Ceiling: -</small>
      </div>
      <div class="card">
        <span class="label">AT PATTERN</span>
        <b id="atPattern">-</b>
        <small id="netRate">純増: -</small>
      </div>
      <div class="card">
        <span class="label">TOTAL DIFF</span>
        <b id="totalDiff">0</b>
        <small>差枚</small>
      </div>
    </section>

    <section class="history-panel">
      <div class="panel-title">
        <h2>EVENT HISTORY</h2>
        <span>WASM EVENT STREAM</span>
      </div>
      <ol id="history"></ol>
    </section>

    <details class="debug">
      <summary>DEBUG STATE</summary>
      <pre id="debugState">WASM未読込</pre>
    </details>
  </main>

  <script src="slot.js"></script>
  <script src="app.js"></script>
</body>
</html>
