name: Verify existing main page with constant-init v2 WASM once
on:
  push:
    branches: [checks/main-v2-constinit-once]
    paths: [.github/workflows/main-v2-constinit-once.yml]
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lld
          node --check web/app-v2.js
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - run: |
          node tools/verify-setting6-wasm.mjs
          node tools/verify-main-v2-ui.mjs
      - name: Store verified binary
        run: |
          git config user.name "setting6-wasm-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build: verified existing main slot v2 [skip ci]"
          git push origin HEAD:checks/main-v2-constinit-once
