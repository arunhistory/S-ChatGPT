name: Probe v2 WASM phase once
on:
  push:
    branches: [checks/main-v2-probe-no-loop]
    paths: [.github/workflows/probe-v2-once.yml]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y lld
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Save build even if the diagnostic fails
        run: |
          git config user.name "setting6-wasm-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build: latest compiled v2 [skip ci]"
          git push origin HEAD:checks/main-v2-probe-no-loop
      - run: node tools/probe-v2-phase.mjs
      - run: node tools/verify-main-v2-ui.mjs
