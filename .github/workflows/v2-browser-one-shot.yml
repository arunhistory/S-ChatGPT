name: One-shot native v2 browser WASM build
on:
  push:
    branches: [build/v2-browser-one-shot-20260924]
    paths: [.github/workflows/v2-browser-one-shot.yml]
permissions:
  contents: write
jobs:
  once:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lld
      - name: Compile actual v2 C++ to latest WebAssembly
        run: |
          bash tools/build-wasm-v2.sh
      - name: Stage identical browser binary
        run: |
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          cmp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Validate both WASM and the real browser's C++ engine
        run: |
          node --check web/setting6-v2.js
          node --check web/v2.js
          node tools/verify-setting6-wasm.mjs
          node - <<'NODE'
          const fs=require('fs');const b=fs.readFileSync('web/slot-v2.wasm');WebAssembly.instantiate(b,{}).then(({instance})=>{const e=instance.exports;e.slot_v2_reset(0x229988,0);console.log('pre',e.slot_v2_setting(),e.slot_v2_phase(),e.slot_v2_preflight());console.log('arm',e.slot_v2_debug_arm(11,2),e.slot_v2_debug_arm(3,2));const x=e.slot_v2_lever();console.log('postlever',x,e.slot_v2_phase(),e.slot_v2_last_role(),e.slot_v2_last_special(),e.slot_v2_machine_area());e.slot_v2_reset(0x229988,0);console.log('diagnostic direct',e.slot_v2_diag_probe_lever(),e.slot_v2_phase(),e.slot_v2_last_role());e.slot_v2_reset(0x229988,0);console.log('diagnostic forced',e.slot_v2_diag_assign_phase(),e.slot_v2_phase());});
          NODE
          node tools/verify-setting6-v2-ui.mjs
      - name: Save compiled files on build-only branch (does not retrigger)
        run: |
          git config user.name "setting6-v2-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build: compiled v2 WASM for playable browser [skip ci]"
          git push origin HEAD:build/v2-browser-one-shot-20260924
