name: One-time native check of setting 6 latency C++
on:
  push:
    branches: [checks/setting6-latent-cpp-only]
    paths: [.github/workflows/setting6-latent-check.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
      - run: |
          cmake --build build-native --target slot_v2_core slot_v2_runtime_normal_hit_test slot_v2_runtime_entry_gate_test slot_v2_setting6_rates_test slot_v2_runtime_chain_zone_test --parallel 2
      - run: |
          for t in slot_v2_runtime_normal_hit_test slot_v2_runtime_entry_gate_test slot_v2_setting6_rates_test slot_v2_runtime_chain_zone_test; do
            "./build-native/$t"
          done
      - run: |
          c++ -std=c++20 -O2 -Isrc/slot-v2/cpp src/slot-v2/cpp/tests/integration/runtime_normal_latent_test.cpp build-native/libslot_v2_core.a -o /tmp/setting6-latency-test
          /tmp/setting6-latency-test
      - run: |
          c++ -std=c++20 -O2 -Isrc/slot-v2/cpp src/slot-v2/cpp/tests/integration/runtime_debug_flags_test.cpp build-native/libslot_v2_core.a -o /tmp/setting6-debug-test
          /tmp/setting6-debug-test
