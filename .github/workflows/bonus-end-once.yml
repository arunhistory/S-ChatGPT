# rerun 4
name: Bonus end one-shot verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bonus-end-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and run BONUS regression
        run: |
          rm -rf .build-slot-v2
          cmake -S . -B .build-slot-v2
          cmake --build .build-slot-v2 --target slot_v2_runtime_bonus_test
          ./.build-slot-v2/slot_v2_runtime_bonus_test
      - name: Rebuild V2 WASM
        run: |
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Verify browser V2
        run: node tools/verify-main-v2-ui.mjs
      - name: Publish rebuilt WASM
        run: |
          if git diff --quiet -- src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm; then
            echo "WASM unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build(v2): rebuild WASM for bonus end fix"
          git push
