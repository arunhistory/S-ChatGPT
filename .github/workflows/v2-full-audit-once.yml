# audit pass 8
name: V2 full audit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-full-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current C++ WASM
        run: |
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Verify browser/WASM contract
        run: node tools/verify-main-v2-ui.mjs
      - name: Run 100k-game WASM audit
        run: node tools/audit-v2-runtime.mjs
