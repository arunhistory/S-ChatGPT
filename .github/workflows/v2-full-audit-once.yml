# final native verification
name: V2 full audit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-full-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all 65 V2 native tests
        run: bash tools/test-v2.sh
      - name: Verify published browser/WASM contract
        run: node tools/verify-main-v2-ui.mjs
      - name: Run published 100k-game WASM audit
        run: node tools/audit-v2-runtime.mjs
