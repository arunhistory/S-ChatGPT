# audit publish
name: V2 full audit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-full-audit-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild current C++ WASM
        run: |
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Verify browser/WASM contract
        run: node tools/verify-main-v2-ui.mjs
      - name: Run 100k-game WASM audit
        run: node tools/audit-v2-runtime.mjs
      - name: Publish audited WASM
        run: |
          if git diff --quiet -- src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm; then
            echo "WASM already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build(v2): publish audited WASM"
          git push
