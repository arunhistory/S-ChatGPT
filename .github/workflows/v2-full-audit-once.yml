# final UI verification
name: V2 full audit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-full-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final published browser/WASM contract
        run: node tools/verify-main-v2-ui.mjs
