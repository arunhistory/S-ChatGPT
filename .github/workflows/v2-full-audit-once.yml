# audit pass 5
name: V2 full audit once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-full-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every native target
        run: |
          rm -rf .build-slot-v2
          cmake -S . -B .build-slot-v2
          cmake --build .build-slot-v2 -j2
      - name: Run every V2 test and aggregate failures
        shell: bash
        run: |
          set +e
          total=0
          failed=0
          for t in .build-slot-v2/slot_v2_*_test; do
            [ -x "$t" ] || continue
            total=$((total+1))
            echo "===== RUN $(basename "$t") ====="
            "$t"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "AUDIT_FAIL $(basename "$t") rc=$rc"
              failed=$((failed+1))
            else
              echo "AUDIT_OK $(basename "$t")"
            fi
          done
          echo "AUDIT_SUMMARY total=$total failed=$failed passed=$((total-failed))"
          exit $failed
