name: Build WASM

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "web/slot.js"
      - "web/slot.wasm"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasm-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure WASM
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: cmake --build build-wasm --target slot_wasm -j2

      - name: Copy generated runtime
        run: |
          cp build-wasm/slot.js web/slot.js
          cp build-wasm/slot.wasm web/slot.wasm

      - name: Commit generated WASM
        run: |
          if [ -z "$(git status --porcelain -- web/slot.js web/slot.wasm)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/slot.js web/slot.wasm
          git commit -m "Build WebAssembly runtime [skip ci]"
          git push
