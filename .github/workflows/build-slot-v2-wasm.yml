name: Build slot-v2 WASM

on:
  push:
    branches: [main]
    paths:
      - "src/slot-v2/cpp/**"
      - "tools/build-wasm-v2.sh"

permissions:
  contents: write

concurrency:
  group: slot-v2-wasm-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build WASM
        run: |
          clang++ --version
          bash tools/build-wasm-v2.sh
          cp src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
      - name: Verify V2
        run: node tools/verify-main-v2-ui.mjs
      - name: Commit rebuilt WASM
        run: |
          if git diff --quiet -- src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm; then
            echo "WASM unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/slot-v2/wasm/slot-v2.wasm web/slot-v2.wasm
          git commit -m "build(v2): rebuild WASM after stop-control fix"
          git push
